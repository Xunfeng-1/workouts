name: Sync Garmin

on:
  workflow_dispatch:
  schedule:
    # Daily at 00:00 UTC (08:00 Asia/Shanghai).
    - cron: '0 0 * * *'

# contents: write lets this workflow commit synced GPX / activities.json.
# pages + id-token are required because this workflow calls the Pages deploy.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: garmin-sync
  cancel-in-progress: false

env:
  # garmin = Garmin Connect International (garmin.com). Do not set garmin_cn.
  RUN_TYPE: garmin
  ATHLETE: Xunfeng
  TITLE: Xunfeng 的运动
  MIN_GRID_DISTANCE: 10
  # Optional. Set to true if GitHub Actions gets HTTP 429 from Garmin/Cloudflare.
  # Default false. See README. Same idea as running_page PR #1110.
  USE_CLOUDFLARE_WARP: false

jobs:
  sync:
    name: Sync Garmin Connect
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Cloudflare WARP
        if: env.USE_CLOUDFLARE_WARP == 'true'
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

      - name: Connect Cloudflare WARP
        if: env.USE_CLOUDFLARE_WARP == 'true'
        run: |
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 3
          echo "WARP status:"
          warp-cli --accept-tos status
          echo "IP info:"
          curl -s https://cloudflare.com/cdn-cgi/trace | grep -E "ip|warp"

      - name: Run sync Garmin script
        if: env.RUN_TYPE == 'garmin'
        env:
          GARMIN_SECRET_STRING: ${{ secrets.GARMIN_SECRET_STRING }}
        run: |
          if [ -z "$GARMIN_SECRET_STRING" ]; then
            echo "Missing repository secret GARMIN_SECRET_STRING."
            echo "Generate a new garminconnect secret with: python run_page/get_garmin_secret.py <email>"
            echo "Old garth secrets are invalid and must be replaced."
            exit 1
          fi
          set +e
          python run_page/garmin_sync.py "$GARMIN_SECRET_STRING"
          status=$?
          set -e
          # Refresh can rotate di_refresh_token before the download finishes.
          # Commit the ciphertext even when the sync fails, or the next run
          # keeps the already-invalid refresh token. This file is not plaintext.
          if [ -f run_page/.garmin_token.enc ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add run_page/.garmin_token.enc
            if ! git diff --cached --quiet; then
              git commit -m "chore: update encrypted Garmin token"
              git push origin HEAD:main
            fi
          fi
          exit "$status"

      - name: Disconnect Cloudflare WARP
        if: always() && env.USE_CLOUDFLARE_WARP == 'true'
        run: |
          warp-cli --accept-tos disconnect || true

      - name: Make summary SVGs
        if: env.RUN_TYPE == 'garmin'
        continue-on-error: true
        env:
          TITLE: ${{ env.TITLE }}
          ATHLETE: ${{ env.ATHLETE }}
          MIN_GRID_DISTANCE: ${{ env.MIN_GRID_DISTANCE }}
        run: |
          if [ ! -f run_page/data.db ]; then
            echo "No run_page/data.db yet; skip SVG."
            exit 0
          fi
          python run_page/gen_svg.py --from-db --title "$TITLE" --type github --github-style align-firstday --athlete "$ATHLETE" --special-distance 10 --special-distance2 20 --special-color yellow --special-color2 red --output assets/github.svg --use-localtime --min-distance 0.5 --language zh_CN
          python run_page/gen_svg.py --from-db --title "超过 ${MIN_GRID_DISTANCE} 公里" --type grid --athlete "$ATHLETE" --output assets/grid.svg --special-color yellow --special-color2 red --special-distance 20 --special-distance2 40 --use-localtime --min-distance "$MIN_GRID_DISTANCE" --language zh_CN

      - name: Commit synced data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync Garmin activities"
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  publish_github_pages:
    name: Build and publish GitHub Pages
    needs: sync
    if: needs.sync.result == 'success'
    uses: ./.github/workflows/gh-pages.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
